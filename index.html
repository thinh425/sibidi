<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Web Đầu Tiên Của Tôi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }

        /* Top Navigation Bar */
        .navbar {
            background-color: #c75a00;
            padding: 8px 15px;
        }

        .navbar a {
            color: #000000;
            text-decoration: underline;
            margin-right: 40px;
            font-size: 18px;
            font-weight: bold;
        }

        /* Top Banner Section */
        .hero-section {
            background-color: rgb(252, 122, 0);
            padding: 20px;
            text-align: center;
        }

        .hero-section h1 {
            color: #00008b;
            font-family: 'Comic Sans MS', cursive;
            font-size: 42px;
            font-weight: normal;
            margin-bottom: 0;
            clear: none;
        }

        /* Clearfix for float */
        .hero-section::after {
            content: "";
            display: table;
            clear: both;
            text-align:center;
        }

        /* Middle Content Container */
        .khung-gioi-thieu {
            background-color: #ffbd86;
            padding: 15px;
            color: #000000;
        }

        .khung-gioi-thieu h2 {
            font-size: 18px;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .khung-gioi-thieu p {
            color: #000000;
            font-size: 16px;
            line-height: 1.4;
            margin: 10px 0;
        }

        .khung-gioi-thieu ul {
            margin: 10px 0;
            padding-left: 20px;
        }

        .khung-gioi-thieu a {
            color: #0000ee;
            text-decoration: underline;
        }

        /* Bottom Footer Bar */
        .footer {
            background-color: #cccccc;
            padding: 15px;
            font-size: 15px;
            color: #000000;
        }

        .footer a {
            color: #0000ee;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="https://daihoc.fpt.edu.vn/">Web Trường</a>
        <a href="1_page.html">Chi tiết</a>
    </div>

    <div class="hero-section">
        <h1>Chào Mừng Đến Với Trang Web Của Tôi</h1>
    </div>

    <div class="khung-gioi-thieu">
        <p>Tôi là sinh viên FPTU!!!</p>
        
        <h2>Sở thích của tôi</h2>
        <ul>
            <li>Học lập trình</li>

            <li>Đọc sách</li>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQKrH5khn-ChVyZi8cFBoV2jnPzALcq2PKcohGwh8WZNA&s=10" width="450">
            <li>Nghe nhạc</li>

        </ul>
    </div>

    <div class="footer">
         <a href="#">Quay về trang chủ</a>
    </div>

</body>
</html>
